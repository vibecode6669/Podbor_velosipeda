<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Велоподбор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: одна колонка 640px, один вопрос на экран, тонкий прогресс сверху; результат — стопка секций с линейными разделителями */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --fg:#151816; --muted:#646a66; --line:#DCDFD9;
  --accent:#2347D6; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --good:#1E7A47; --bad:#B4372B; --bad-soft:#F7E4E1; --good-soft:#E1F1E7;
  --f-display:"Unbounded", "Onest", system-ui, sans-serif;
  --f-body:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111312; --surface:#1A1D1B; --fg:#ECEEEA; --muted:#9BA19C; --line:#2C302D;
  --accent:#8099FF; --accent-ink:#0E1220; --accent-soft:#1F2640;
  --good:#5FC48A; --bad:#F08A7E; --bad-soft:#3A2220; --good-soft:#1B3325; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111312; --surface:#1A1D1B; --fg:#ECEEEA; --muted:#9BA19C; --line:#2C302D;
  --accent:#8099FF; --accent-ink:#0E1220; --accent-soft:#1F2640;
  --good:#5FC48A; --bad:#F08A7E; --bad-soft:#3A2220; --good-soft:#1B3325; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em}
.brand svg{width:34px;height:22px;flex:none}
.stepcount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:28px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}

h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,7vw,38px);line-height:1.12;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:clamp(20px,5.4vw,26px);line-height:1.2}
h3{font-size:17px;font-weight:600}
p{margin:0}
.lead{color:var(--muted);font-size:17px;max-width:58ch}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

.intro{display:grid;gap:22px}
.intro ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.intro li{display:flex;gap:12px;align-items:baseline}
.intro li b{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;min-width:1.4em}

.q{display:grid;gap:18px}
.q .hint{color:var(--muted);font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--muted)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .mark{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;display:grid;place-items:center}
.opt[aria-pressed="true"] .mark{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed="true"] .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.opt .t{display:grid;gap:2px;min-width:0}
.opt .t b{font-weight:600}
.opt .t span{color:var(--muted);font-size:14px}

.field{display:grid;gap:8px}
.field label{font-weight:600}
.numrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:6px 14px}
.numrow input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:22px;font-weight:600;color:var(--fg);padding:8px 0;font-variant-numeric:tabular-nums}
.numrow input:focus{outline:none}
.numrow:focus-within{border-color:var(--accent)}
.numrow em{font-style:normal;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}

.split{display:grid;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 16px}
.split .bar{display:flex;height:34px;border-radius:6px;overflow:hidden;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.split .bar span{display:flex;align-items:center;padding-inline:10px;white-space:nowrap;overflow:hidden;transition:flex-basis .15s}
.split .bar .c{background:var(--accent);color:var(--accent-ink)}
.split .bar .o{background:var(--accent-soft);color:var(--fg);justify-content:flex-end}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.nav{display:flex;gap:10px;margin-top:28px}
.btn{font:inherit;font-weight:600;border-radius:var(--r);padding:14px 20px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.err{color:var(--bad);font-size:14px}

/* результат */
.res{display:grid;gap:34px}
.res section{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:24px}
.res section:first-child{border-top:0;padding-top:0}
.hero{display:grid;gap:12px}
.match{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--good);background:var(--good-soft);border-radius:999px;padding:4px 12px;width:max-content}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--surface)}
.profile{display:grid;gap:8px}
.profile .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.profile .bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}

dl.specs{margin:0;display:grid;grid-template-columns:minmax(110px,32%) 1fr;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
dl.specs dt,dl.specs dd{margin:0;padding:11px 14px;border-top:1px solid var(--line);min-width:0}
dl.specs dt{color:var(--muted);font-size:14px}
dl.specs dt:first-of-type,dl.specs dt:first-of-type + dd{border-top:0}
@media (max-width:440px){dl.specs{grid-template-columns:1fr} dl.specs dd{border-top:0;padding-top:0} dl.specs dt{padding-bottom:2px}}

.alts{display:grid;gap:10px}
.alt{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.alt .pct{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.alt p{grid-column:1/-1;color:var(--muted);font-size:14px}

.nope{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.nope li{padding:12px 14px;border-radius:var(--r);background:var(--bad-soft);display:grid;gap:2px}
.nope li b{color:var(--bad)}
.nope li span{font-size:14px}

.big{display:flex;flex-wrap:wrap;gap:12px}
.big div{flex:1 1 140px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.big b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.big span{font-size:13px;color:var(--muted)}

.tier{display:grid;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tier .tag{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.tier .price{font-weight:600;font-variant-numeric:tabular-nums}
.tier p{font-size:15px}
.tier.warn .tag{color:var(--bad)}
.note{font-size:14px;color:var(--muted)}

.plat{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.plat li{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding-block:8px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.plat a{color:var(--accent);font-weight:600;text-decoration:none}
.plat a:hover{text-decoration:underline}
.plat span{font-size:14px;color:var(--muted)}

.check{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.check li label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.check li label span{min-width:0}
.check li small{display:block;color:var(--muted);font-size:13px}
.check input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}

table.acc{width:100%;border-collapse:collapse;font-size:15px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.acc td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
table.acc tr:first-child td{border-top:0}
table.acc td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
table.acc tr.sum td{font-weight:600;color:var(--fg);background:var(--accent-soft)}
table.acc small{display:block;color:var(--muted);font-size:13px}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 180px}

.models{display:grid;gap:10px}
.model{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.model .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.model .pr{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.model .fit{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--good-soft);color:var(--good)}
.model .fit.over{background:var(--bad-soft);color:var(--bad)}
.model .links{display:flex;flex-wrap:wrap;gap:8px}
.model .links a{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.model .links a:hover{border-color:var(--accent)}
.say{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:14px 16px;white-space:pre-line;font-size:15px}
.copyline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.copyline .btn{padding:10px 16px;font-size:14px}
.copyline .ok{font-size:13px;color:var(--good)}
dl.specs dd b{font-weight:600}
.res,.res *{overflow-wrap:anywhere}
html,body{overflow-x:clip}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand" aria-label="Велоподбор">
      <svg viewBox="0 0 34 22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="15" r="6"/><circle cx="27" cy="15" r="6"/><path d="M7 15 13 5h10l4 10M13 5l5 10h-11M18 15l5-10M11 3h4M21 3h3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Велоподбор
    </div>
    <div class="stepcount" id="stepcount"></div>
  </header>
  <div class="progress" id="progressWrap" hidden><i id="progress"></i></div>
  <main id="app"></main>
  <footer>Цены ориентировочные для Казахстана на 2026 год и зависят от города, сезона и курса. Перед покупкой сверяйте актуальные предложения.</footer>
</div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const app = $("#app");
const fmt = n => n.toLocaleString("ru-RU").replace(/,/g," ") + " ₸";
const k = n => n >= 1000000 ? (Math.round(n/100000)/10).toString().replace(".",",")+" млн ₸" : Math.round(n/1000)+" тыс. ₸";

/* ---------- Типы велосипедов ---------- */
const TYPES = {
  city:{name:"Городской / комфорт",short:"Прямая посадка, крылья, багажник, минимум обслуживания.",
    weight:"14–18 кг",
    specs:{"Рама":"Алюминий или сталь, низкая или средняя верхняя труба — удобно садиться в обычной одежде","Колёса и шины":"28\" (700C), шины 35–47 мм с защитой от проколов","Тормоза":"Ободные V-brake допустимы, лучше роллерные или дисковые","Трансмиссия":"Планетарная втулка на 3–8 скоростей (Shimano Nexus) — не боится грязи и зимы","Вилка":"Жёсткая или с коротким ходом 40–60 мм","Обязательно":"Крылья, подножка, багажник, защита цепи"},
    tiers:[[100000,"Начальный уровень","Stels, Forward, Stark, Format: сталь или алюминий, 3–7 скоростей, ободные тормоза. Нормально для поездок до 5–7 км."],[180000,"Оптимум","Merida, Giant, Cube, Author: планетарка Nexus 3–7, крылья и багажник с завода, роллерные или дисковые тормоза."],[350000,"Комфорт без забот","Nexus 8 / Alfine, ременной привод, динамо-фара, лёгкая рама. Почти не требует обслуживания."]],
    whyNot:"Тяжёлый и неторопливый: на дистанциях от 20 км и на подъёмах будет утомлять."},
  hybrid:{name:"Гибрид / фитнес",short:"Универсал: быстрее горного по асфальту, крепче шоссейного на ямах.",
    weight:"11–14 кг",
    specs:{"Рама":"Алюминий, крепления под крылья и багажник","Колёса и шины":"28\" (700C), шины 35–45 мм с лёгким протектором","Тормоза":"Гидравлические дисковые — лучший вариант для ежедневной езды","Трансмиссия":"1×9 … 3×8, кассета до 34–42 зубов для подъёмов","Вилка":"Жёсткая (легче) или короткий ход 50–63 мм с блокировкой","Обратите внимание":"Отверстия под багажник и крылья, ширина покрышки не меньше 35 мм для бордюров"},
    tiers:[[150000,"Начальный уровень","Trinx, Format, Stark, Forward: алюминий, 21–24 скорости, механические диски."],[250000,"Оптимум","Merida Crossway, Giant Escape, Trek FX / Dual Sport, Cube Nature: гидравлика, качественный привод Shimano."],[450000,"Лёгкий и быстрый","Лёгкая рама, 1×10–1×12, гидравлика, хорошие колёса. Можно ездить 50+ км."]],
    whyNot:"На тропах и камнях не хватит вилки и ширины покрышки."},
  hardtail:{name:"Горный хардтейл (МТБ)",short:"Амортизационная вилка, широкие шины, надёжность на грунте и в горах.",
    weight:"12–15 кг",
    specs:{"Рама":"Алюминий, современная геометрия","Колёса и шины":"29\" при росте от 165 см, 27,5\" — ниже. Шины 2,2–2,4\"","Тормоза":"Только гидравлические дисковые, роторы 160–180 мм","Трансмиссия":"1×10 … 1×12 или 2×9, большая звезда кассеты 42–51 зуб","Вилка":"Ход 100–120 мм, лучше воздушная. Пружинная «ради галочки» на дешёвых моделях бесполезна","Обратите внимание":"Ось 15 мм в вилке, крепление под дропер-подсед"},
    tiers:[[150000,"Начальный уровень","Trinx, Stels Navigator, Format, Forward: подходят для грунтовок и парков, не для серьёзных трейлов."],[250000,"Оптимум","Merida Big Nine / Big Seven, Giant Talon, Trek Marlin 5–6, Cube Aim: гидравлика, нормальная вилка, рама на вырост."],[500000,"Для гор всерьёз","Trek Marlin 7+, Merida Big Nine 300+, Cube Attention: воздушная вилка, 1×12, рама под апгрейды."]],
    whyNot:"По асфальту медленнее и тяжелее гибрида: широкие зубастые шины крадут скорость."},
  fullsus:{name:"Двухподвес (трейл / эндуро)",short:"Подвеска спереди и сзади для крутых спусков и сложных троп.",
    weight:"14–16 кг",
    specs:{"Рама":"Алюминий или карбон, ход задней подвески 120–160 мм","Колёса и шины":"29\" или 27,5\", шины 2,3–2,6\"","Тормоза":"Гидравлика, 4-поршневые калиперы, роторы 180–203 мм","Трансмиссия":"1×12","Подвеска":"Воздушные вилка и амортизатор с регулировкой отбоя","Обратите внимание":"Подшипники маятника, наличие сервиса амортизаторов в городе"},
    tiers:[[700000,"Начальный уровень","Merida One-Twenty / One-Forty, Giant Stance, Trek Fuel начальных версий."],[1200000,"Оптимум","Воздушная подвеска Fox / RockShox среднего уровня, дропер, 1×12 Deore / SX-NX."],[2000000,"Топ","Карбон, топовая подвеска, лёгкие колёса."]],
    whyNot:"Дорогой, тяжёлый и требует сервиса. Двухподвес дешевле 600 тыс. ₸ новым — почти всегда «игрушка», которая ломается."},
  road:{name:"Шоссейный",short:"Максимальная скорость на хорошем асфальте, руль-баран.",
    weight:"8–10 кг",
    specs:{"Рама":"Алюминий или карбон, эндуранс-геометрия для новичков","Колёса и шины":"700C, шины 28–32 мм (не 23–25 — по нашим дорогам жёстко)","Тормоза":"Дисковые (лучше гидравлика)","Трансмиссия":"2×8 Claris и выше, лучше 2×10–11 Tiagra / 105","Вилка":"Жёсткая","Обратите внимание":"Просвет под шины 32 мм и шире — пригодится на плохом асфальте"},
    tiers:[[350000,"Начальный уровень","Merida Scultura / Giant Contend / Trek Domane AL: Shimano Claris или Sora."],[600000,"Оптимум","Tiagra / 105, дисковые тормоза, лёгкие колёса."],[1200000,"Для гонок","Карбоновая рама, 105 Di2 / Ultegra, аэро-колёса."]],
    whyNot:"Узкие шины и низкая посадка: бордюры, ямы и грунтовки — не для него."},
  gravel:{name:"Грэвел",short:"Руль-баран и широкие шины: быстро по асфальту, уверенно по грунту и степным трассам.",
    weight:"9,5–11 кг",
    specs:{"Рама":"Алюминий или сталь, много креплений под фляги и сумки","Колёса и шины":"700C, шины 38–45 мм, полуслики или лёгкий протектор","Тормоза":"Дисковые, лучше гидравлика","Трансмиссия":"1×11 / 2×10 с лёгкими передачами (кассета 11–42)","Вилка":"Жёсткая, с креплениями под багаж","Обратите внимание":"Просвет под шины 45 мм+, крепления под багажник — для дальних поездок"},
    tiers:[[400000,"Начальный уровень","Cube Nuroad, Merida Silex начальных версий, Giant Revolt, Format: Shimano Claris / Sora, механические диски."],[700000,"Оптимум","GRX 400–600, гидравлика, лёгкие колёса."],[1200000,"Для марафонов","Карбон, 1×12 / 2×12, бескамерные колёса."]],

}

      <div class="field"><label for="h">Рост</label><div class="numrow"><input id="h" inputmode="numeric" type="number" min="120" max="215" placeholder="175" value="${A.height}"><em>см</em></div></div>
      <div class="field"><label for="w">Вес</label><div class="numrow"><input id="w" inputmode="numeric" type="number" min="25" max="200" placeholder="75" value="${A.weight}"><em>кг</em></div></div>
    </div><p class="err" id="err" hidden></p>`;
  } else if(s.type === "split"){
    body = `<div class="split">
      <div class="bar"><span class="c" id="sc"></span><span class="o" id="so"></span></div>
      <input type="range" id="pct" min="0" max="100" step="10" value="${A.cityPct}" aria-label="Доля езды по городу">

    </div>

      ["steppe","Степные трассы","Асфальт и грунтовки, ветер, длинные прямые"],
      ["mountain","Горные дороги и тропы","Подъёмы, серпантины, камни"],
      ["both","И те, и другие",""]]})}</div>`;
  } else body = optHTML(s);

  app.innerHTML = `<div class="q">
    <h2>${s.title}</h2>${s.hint?`<p class="hint">${s.hint}</p>`:""}
    ${body}
    <div class="nav"><button class="btn" id="back">Назад</button><button class="btn primary" id="next">${step===STEPS.length-1?"Показать результат":"Далее"}</button></div>
  </div>`;

  const next = $("#next");
  const valid = () => {
    if(s.type==="body") return true;
    if(s.type==="split") return true;
    return A[s.id] !== undefined;
  };
  next.disabled = !valid();

  app.querySelectorAll(".opts").forEach(group => {
    const isTrips = group.closest("#tripsBox");
    group.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const key = isTrips ? "trips" : s.id;
      let v = b.dataset.v; if(key==="budget") v = Number(v);
      A[key] = v;
      group.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", x===b ? "true":"false"));
      next.disabled = !valid();
      if(!isTrips && s.type!=="split") setTimeout(()=>{ step++; render(); }, 180);
    });
  });

  if(s.type==="split"){
    const r = $("#pct"), tb = $("#tripsBox");
    const upd = () => { A.cityPct = Number(r.value);
      const c = A.cityPct, o = 100-c;
      $("#sc").style.flexBasis = c+"%"; $("#so").style.flexBasis = o+"%";
      $("#sc").textContent = c>=15 ? "Город "+c+"%" : ""; $("#so").textContent = o>=15 ? "Трассы "+o+"%" : "";
      tb.hidden = o === 0; };
    r.oninput = upd; upd();
  }
  $("#back").onclick = () => { step--; render(); };
  next.onclick = () => {
    if(s.type==="body"){
      const h = Number($("#h").value), w = Number($("#w").value), e = $("#err");
      if(!(h>=120 && h<=215)){ e.textContent="Укажите рост от 120 до 215 см."; e.hidden=false; return; }
      if(!(w>=25 && w<=200)){ e.textContent="Укажите вес от 25 до 200 кг."; e.hidden=false; return; }
      A.height=h; A.weight=w;
    }
    step++; render();
  };
}

function score(){
  const S = {}; const why = {}; ORDER.forEach(t=>{S[t]=0; why[t]=[];});
  const add = (map, label, mult=1) => { for(const t in map){ S[t]+=map[t]*mult; if(map[t]*mult>=2) why[t].push(label); } };
  ["place","purpose","surface","style","dist","storage"].forEach(key => { if(A[key]!==undefined) add(W[key][A[key]], LABEL[key][A[key]]); });
  const c = A.cityPct, o = 100-c;
  if(c >= 70) add({city:2,hybrid:1,fixie:1,folding:1,cruiser:1,fullsus:-2}, "в основном город");
  const m = o/100*2; // до 2× на чистые трассы
  if(o > 0){
    if(A.trips==="steppe"||A.trips==="both") add({gravel:3,road:2,hybrid:2,hardtail:1,cruiser:-2,folding:-2,fixie:-2}, `степные трассы ${o}%`, m);
    if(A.trips==="mountain"||A.trips==="both") add({hardtail:3,fullsus:2,gravel:1,ebike:1,cruiser:-3,folding:-3,fixie:-3,city:-2}, `горные вылазки ${o}%`, m);
  }
  if(A.weight > 110){ S.road-=1; S.folding-=2; S.fullsus-=1; }
  const ranked = ORDER.slice().sort((a,b)=>S[b]-S[a]);
  return {S, why, ranked};
}

function frameSize(type){
  const h = A.height;
  const mtb = h<155?["XS","13–14\""]:h<165?["S","15–16\""]:h<175?["M","17–18\""]:h<185?["L","19–20\""]:h<193?["XL","21–22\""]:["XXL","23\"+"];
  const rd  = h<155?["XS","47–49 см"]:h<165?["S","50–52 см"]:h<175?["M","53–55 см"]:h<185?["L","56–58 см"]:h<193?["XL","59–61 см"]:["XXL","62 см+"];
  const wheelMtb = h<165 ? "27,5\"" : "29\"";
  switch(type){
    case "hardtail": case "fullsus": return {size:mtb[0],detail:"рама "+mtb[1],wheel:wheelMtb};
    case "hybrid": case "city": case "ebike": return {size:mtb[0],detail:"рама "+mtb[1],wheel:h<155?"26–27,5\"":"28\" (700C)"};
    case "road": case "gravel": case "fixie": return {size:rd[0],detail:"рама "+rd[1],wheel:"700C"};
    case "cruiser": return {size:h<165?"S":h<180?"M":"L",detail:"проверьте, что стопа достаёт до земли с седла",wheel:"26\""};
    case "folding": return {size:"Единый",detail:`подседел должен выдвигаться до ~${Math.round(h*0.47)} см от каретки`,wheel:h>185?"24\"":"20\""};
  }
}

function budgetBlock(type){
  const T = TYPES[type], B = A.budget, cond = A.cond, out = [];
  const tiersNew = T.tiers.filter(x=>x[0] <= B);
  const usedK = 0.55;
  const tiersUsed = T.tiers.filter(x=>Math.round(x[0]*usedK) <= B);
  const fmtRange = (i, factor) => { const from = Math.round(T.tiers[i][0]*factor/10000)*10000;
    const to = T.tiers[i+1] ? Math.round(T.tiers[i+1][0]*factor/10000)*10000 : null;
    return to ? `${k(from)} – ${k(to)}` : `от ${k(from)}`; };
  if(cond!=="used"){
    if(tiersNew.length){ const i = tiersNew.length-1;
      out.push(`<div class="tier"><span class="tag">Новый · ${T.tiers[i][1]}</span><span class="price">${fmtRange(i,1)}</span><p>${T.tiers[i][2]}</p></div>`); }
    else out.push(`<div class="tier warn"><span class="tag">Новый · не хватает бюджета</span><span class="price">нормальный новый — от ${k(T.tiers[0][0])}</span><p>В вашей сумме новым этот тип будет только супермаркетного уровня. ${cond==="new"?"Рассмотрите б/у или накопите до нижней границы.":"Выгоднее взять б/у."}</p></div>`);
  }
  if(cond!=="new"){
    if(tiersUsed.length){ const i = tiersUsed.length-1;
      out.push(`<div class="tier"><span class="tag">Б/у, 2–5 лет · ${T.tiers[i][1]}</span><span class="price">${fmtRange(i,usedK)}</span><p>${T.tiers[i][2]} На вторичке такой велосипед стоит примерно 45–60% от цены нового.</p></div>`); }
    else out.push(`<div class="tier warn"><span class="tag">Б/у · не хватает бюджета</span><span class="price">от ${k(Math.round(T.tiers[0][0]*usedK/10000)*10000)}</span><p>Даже на вторичке приличный велосипед этого типа стоит дороже. Посмотрите альтернативы ниже.</p></div>`);
  }
  return out.join("");
}

  const T = TYPES[type], B = A.budget, cond = A.cond;

  const lo = Math.round(T.tiers[0][0]*f/10000)*10000;
  if(B >= 2000000) return "от "+k(Math.max(lo,1000000));

  return k(lo)+" – "+k(B);
}

        ${cond!=="new"?`<a href="${LINK.olx(m[1],usedTo)}" target="_blank" rel="noopener">OLX б/у</a><a href="${LINK.kobj(m[1])}" target="_blank" rel="noopener">Kaspi Объявления</a>`:""}
      </div></div>`;}).join("")}</div>
  <p class="note">Ссылки открывают актуальные объявления по модели. Год и комплектация влияют на цену — сверяйте характеристики с таблицей выше. Общий поиск по типу: ${cond!=="used"?`<a href="${LINK.kaspi(E.q)}" target="_blank" rel="noopener">Kaspi</a> · `:""}<a href="${LINK.olx(E.q,usedTo)}" target="_blank" rel="noopener">OLX</a> · <a href="${LINK.kobj(E.q)}" target="_blank" rel="noopener">Kaspi Объявления</a></p>`;
}
function copyBtn(id, getText){
  const b = document.getElementById(id); if(!b) return;
  b.onclick = () => { const t = getText(); const ok = () => { const s = b.nextElementSibling; if(s) s.hidden = false; };
    try { navigator.clipboard.writeText(t).then(ok, () => fallback(t, ok)); } catch(e){ fallback(t, ok); } };
}

function renderResult(){
  const {S, why, ranked} = score();
  const top = ranked[0], T = TYPES[top];
  const max = S[top], min = S[ranked[ranked.length-1]];
  const pct = t => Math.max(5, Math.round(40 + 59*(S[t]-min)/Math.max(1,(max-min))));
  const fs = frameSize(top);
  const alts = ranked.slice(1,3);
  const worst = ranked.slice(-3).reverse();
  const acc = accessories(top);
  const c = A.cityPct, o = 100-c;
  const tripName = {steppe:"степные трассы",mountain:"горные вылазки",both:"степь и горы"}[A.trips];
  const lightBike = A.storage==="nolift" ? `<p class="note">Вы носите велосипед по лестнице — ищите модель легче 13 кг.</p>` : "";
  const reasons = why[top].length ? why[top] : [LABEL.purpose[A.purpose]];

  app.innerHTML = `<div class="res">
  <section class="hero">
    <span class="eyebrow">Ваш тип велосипеда</span>
    <h1>${T.name}</h1>
    <span class="match">Совпадение ${pct(top)}%</span>
    <p class="lead">${T.short}</p>
    <div class="chips">${reasons.map(r=>`<span class="chip">${r}</span>`).join("")}</div>
  </section>

  <section class="profile">
    <h3>Профиль катания</h3>
    <div class="bar" role="img" aria-label="Город ${c}%, ${tripName||"трассы"} ${o}%"><i style="width:${c}%;background:var(--accent)"></i><i style="width:${o}%;background:var(--muted)"></i></div>
    <div class="legend"><span style="--c:var(--accent)">Город ${c}%</span>${o?`<span style="--c:var(--muted)">${tripName} ${o}%</span>`:""}</div>
  </section>

  <section>
    <h2>Размер и вес</h2>
    <div class="big">
      <div><b>${fs.size}</b><span>${fs.detail}</span></div>
      <div><b>${fs.wheel}</b><span>диаметр колёс</span></div>
      <div><b>${T.weight}</b><span>нормальный вес велосипеда</span></div>
    </div>
    ${lightBike}
    <ul class="nope" style="--x:0">${weightNotes().map(n=>`<li style="background:var(--surface);border:1px solid var(--line)"><span>${n}</span></li>`).join("")}</ul>
    <p class="note">Размер — ориентир по росту ${A.height} см. Перед покупкой обязательно прокатитесь: на разных брендах одна буква размера отличается.</p>
  </section>

  <section>
    <h2>На что смотреть при покупке</h2>
    <dl class="specs">${Object.entries(T.specs).map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>
  </section>

  <section>
    <h2>Что вбить в фильтры</h2>
    <p class="note">Эти значения выставляйте в фильтрах Kaspi, OLX и интернет-магазинов. Можно скопировать и показать продавцу.</p>
    <dl class="specs">${filterRows(top).map(([a,b])=>`<dt>${a}</dt><dd><b>${b}</b></dd>`).join("")}</dl>
    <div class="copyline"><button class="btn" id="copyFilters">Скопировать параметры</button><span class="ok" hidden>Скопировано</span></div>
  </section>

  <section>
    <h2>Что сказать продавцу</h2>
    <div class="say" id="sayText">${sellerText(top)}</div>
    <div class="copyline"><button class="btn" id="copySay">Скопировать сообщение</button><span class="ok" hidden>Скопировано</span></div>
    <p class="note">Подходит для WhatsApp-сообщения в веломагазин или продавцу на OLX.</p>
  </section>

  <section>
    <h2>Что можно купить за ваш бюджет</h2>
    <p class="note">Ваш бюджет: ${A.budget>=2000000?"больше 1 млн ₸":"до "+k(A.budget)}. Цены ориентировочные.</p>
    ${budgetBlock(top)}
  </section>

  <section>
    <h2>Примеры моделей со ссылками</h2>
    ${modelsBlock(top)}
  </section>

  <section>
    <h2>Где искать</h2>
    ${A.cond!=="used"?`<h3>Новые</h3><ul class="plat">${PLATFORMS.new.map(p=>`<li><a href="${p[1]}" target="_blank" rel="noopener">${p[0]}</a><span>${p[2]}</span></li>`).join("")}</ul>`:""}
    ${A.cond!=="new"?`<h3>Б/у</h3><ul class="plat">${PLATFORMS.used.map(p=>`<li><a href="${p[1]}" target="_blank" rel="noopener">${p[0]}</a><span>${p[2]}</span></li>`).join("")}</ul>`:""}
  </section>

  <section>
    <h2>Альтернативы</h2>
    <div class="alts">${alts.map(t=>`<div class="alt"><h3>${TYPES[t].name}</h3><span class="pct">${pct(t)}%</span><p>${TYPES[t].short}</p><p><a href="${A.cond==="used"?LINK.olx(EXTRA[t].q, A.budget>=2000000?null:A.budget):LINK.kaspi(EXTRA[t].q)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;text-decoration:none">Смотреть варианты →</a></p></div>`).join("")}</div>
  </section>

  <section>
    <h2>Чего не брать</h2>
    <ul class="nope">
      ${worst.map(t=>`<li><b>${TYPES[t].name}</b><span>${TYPES[t].whyNot}</span></li>`).join("")}
      ${traps(top).map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join("")}
    </ul>
  </section>

  ${A.cond!=="new"?`<section>
    <h2>Чек-лист осмотра б/у</h2>
    <p class="note">Отмечайте пункты прямо на месте осмотра.</p>
    <ul class="check">${USED_CHECK.map((x,i)=>`<li><label for="c${i}"><input type="checkbox" id="c${i}"><span>${x[0]}<small>${x[1]}</small></span></label></li>`).join("")}</ul>
  </section>`:""}

  <section>
    <h2>Аксессуары</h2>
    <div class="tablewrap"><table class="acc"><tbody>
      ${acc.L.map(r=>`<tr><td>${r[0]}</td><td>${r[1]} ₸</td></tr>`).join("")}
      <tr class="sum"><td>Итого заложите сверху</td><td>${acc.lo}–${acc.hi} тыс. ₸</td></tr>
    </tbody></table></div>
    <p class="note">Не экономьте на замке и свете: замок стоит меньше 10% велосипеда, а без света вечером опасно.</p>
  </section>

  <section>
    <div class="actions">
      <button class="btn" id="copy">Скопировать итог</button>
      <button class="btn primary" id="again">Пройти заново</button>
    </div>
    <p class="note" id="copied" hidden>Итог скопирован.</p>
  </section>
  </div>`;

  copyBtn("copyFilters", () => filterRows(top).map(([a,b])=>a+": "+b).join("\n"));
  copyBtn("copySay", () => sellerText(top));
  $("#again").onclick = () => { for(const key of ["place","purpose","surface","style","dist","storage","cond","budget"]) delete A[key]; step = 0; render(); };
  $("#copy").onclick = () => {
    const txt = `Мой велосипед: ${T.name} (${pct(top)}%)\nРазмер: ${fs.size}, ${fs.detail}; колёса ${fs.wheel}\nВес велосипеда: ${T.weight}\n` +
      Object.entries(T.specs).map(([a,b])=>`• ${a}: ${b}`).join("\n") +
      "\n\nФильтры:\n" + filterRows(top).map(([a,b])=>a+": "+b).join("\n") + `\nАльтернативы: ${alts.map(t=>TYPES[t].name).join(", ")}\nНе брать: ${worst.map(t=>TYPES[t].name).join(", ")}\nАксессуары: ${acc.lo}–${acc.hi} тыс. ₸`;
    const done = () => { $("#copied").hidden = false; };
    try { navigator.clipboard.writeText(txt).then(done, () => fallback(txt, done)); } catch(e){ fallback(txt, done); }
  };
}
function fallback(txt, done){
  const ta = document.createElement("textarea"); ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){} ta.remove();
}

render();
})();
</script>
</body>
</html>
